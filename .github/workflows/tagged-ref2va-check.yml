name: Tagged REF2VA checks

on:
  push:
    branches: [feature/tagged-ref2va]
  pull_request:
    paths:
      - 'nodes/nodes_minimax_h3_director_tagged.py'
      - 'js/minimax_h3_tagged_refs.js'
      - '.tests/test_minimax_h3_tagged_refs.py'
      - '__init__.py'

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax
        run: python -m py_compile nodes/nodes_minimax_h3_director_tagged.py
      - name: JavaScript syntax
        run: node --check js/minimax_h3_tagged_refs.js
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy Pillow torch
      - name: Run tagged REF2VA tests
        run: pytest -q .tests/test_minimax_h3_tagged_refs.py
